version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the build toolchain rather than five.
      build-tooling:
        patterns: ["electron", "electron-builder", "eslint"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
