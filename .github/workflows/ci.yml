# The QA gate. Every job here must pass before a pull request can be merged: the
# branch protection rule requires the single "QA Gate" check at the bottom, which
# only goes green when every job above it did.
name: CI

on:
  # Any pushed branch is checked, so a failure shows up before a pull request is
  # even opened. The concurrency group below keeps this from doubling up with
  # the pull_request run on the same branch.
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Release runs the identical gate before it publishes anything.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  static:
    name: Lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Every JavaScript file parses
        run: npm run check:syntax
      - name: Lint
        run: npm run lint
      - name: The lockfile matches package.json
        run: |
          npm ci --dry-run >/dev/null
          git diff --exit-code package-lock.json

  unit:
    name: Unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          # The app ships on Electron's Node, but the kernel modules are plain
          # Node: check the oldest release that still has node:sqlite too.
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Configure git for the checkpoint tests
        run: |
          git config --global user.email "ci@lyra.local"
          git config --global user.name "Lyra CI"
          git config --global init.defaultBranch main
      - name: Run the test suite
        run: npm run test:unit

  selftest:
    name: Kernel self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache the Electron download
        uses: actions/cache@v6
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - name: Make sure the Electron binary is downloaded
        run: node scripts/ensure-electron.js
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - name: Configure git for the checkpoint tests
        run: |
          git config --global user.email "ci@lyra.local"
          git config --global user.name "Lyra CI"
      - name: Break the organs on purpose and check the kernel recovers
        run: npm run selftest

  smoke:
    name: App smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache the Electron download
        uses: actions/cache@v6
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - name: Make sure the Electron binary is downloaded
        run: node scripts/ensure-electron.js
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - name: Configure git
        run: |
          git config --global user.email "ci@lyra.local"
          git config --global user.name "Lyra CI"
      - name: Start the app and check the window renders
        run: npm run smoke
        env:
          SMOKE_OUT: ${{ github.workspace }}/smoke-output
      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-output
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build installers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            command: npm run dist:mac
            artifacts: "dist/*.dmg\ndist/*.zip"
          - os: windows-latest
            name: Windows
            command: npm run dist:win
            artifacts: "dist/*.exe"
          - os: ubuntu-latest
            name: Linux
            command: npm run dist:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/*.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache the Electron download
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Make sure the Electron binary is downloaded
        run: node scripts/ensure-electron.js
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - name: Compile the app into an installer
        run: ${{ matrix.command }}
        env:
          # Unsigned builds: signing is done at release time with real secrets.
          # Publishing is the release workflow's job, never the build's.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Check the installers were produced and the packaged app starts
        shell: bash
        run: node scripts/check-artifacts.js --launch
      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: No known high-severity vulnerabilities
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to file the findings under the Security tab
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not just the tip: a key that was committed and
          # then deleted is still sitting in an old commit for anyone to read.
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          # Pinned, and checked against the hash published with the release —
          # this binary is handed every secret the history has ever contained.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" gitleaks
      - name: No secret has ever been committed
        # --redact keeps the secret itself out of both the log and the report.
        # The report is uploaded below, and a leaked key must not leak twice.
        run: |
          ./gitleaks git . \
            --report-format sarif --report-path gitleaks.sarif \
            --redact --no-banner --verbose --platform github
      - name: File the findings
        # Runs even when the scan failed, because that is when there is
        # something to file. A pull request from a fork only gets a read-only
        # token, so the upload cannot work there: the scan above is what blocks
        # the merge, this is only the Security tab's view of it.
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # Deliberately not part of the QA gate below. Electronegativity exits 0 no
  # matter what it finds, most of what it reports is "a human should look at
  # this" rather than a defect, and its Electron release database stopped being
  # updated in 2023 so it cannot judge the version this app actually ships. It
  # is here to put Electron misconfigurations in front of a reviewer, not to
  # block a merge. To make it blocking, add `electron` to the gate's `needs`
  # and have the summary step exit non-zero on the checks worth failing on.
  electron:
    name: Electron audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No `npm ci`: Electronegativity reads the source, so installed
      # dependencies would only give it a node_modules tree to wade through.
      - name: Look for Electron misconfigurations
        run: npx --yes @doyensec/electronegativity@1.10.3 --relative --input . --output electronegativity.sarif
      - name: Make the report fit code scanning
        run: |
          node - electronegativity.sarif <<'EOF'
          // The project-wide checks report their location as "file:///", which
          // code scanning rejects: it only accepts repository-relative paths.
          // Point those findings at package.json so the report is accepted.
          const fs = require('fs');
          const path = process.argv[2];
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          let moved = 0;
          for (const run of report.runs || []) {
            for (const result of run.results || []) {
              for (const location of result.locations || []) {
                const artifact = location.physicalLocation?.artifactLocation;
                if (!artifact || !/^([a-z][a-z0-9+.-]*:|\/)/i.test(artifact.uri)) continue;
                artifact.uri = 'package.json';
                delete location.physicalLocation.region;
                moved++;
              }
            }
          }
          fs.writeFileSync(path, JSON.stringify(report));
          console.log(`Repointed ${moved} project-wide finding(s) at package.json.`);
          EOF
      - name: Summarise what it found
        run: |
          node - electronegativity.sarif <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).runs[0].results || [];
          console.log('## Electron audit\n');
          if (!results.length) { console.log('Nothing found.'); process.exit(0); }
          console.log(`${results.length} finding(s). Full detail in the Security tab.\n`);
          console.log('| Level | Check | Where |');
          console.log('| --- | --- | --- |');
          for (const r of results) {
            const at = r.locations?.[0]?.physicalLocation;
            const line = at?.region?.startLine;
            console.log(`| ${r.level || 'note'} | ${r.ruleId} | \`${at?.artifactLocation?.uri}${line ? ':' + line : ''}\` |`);
          }
          EOF
      - name: File the findings
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: electronegativity.sarif
          category: electronegativity

  gate:
    name: QA Gate
    runs-on: ubuntu-latest
    needs: [static, unit, selftest, smoke, build, audit, secrets]
    if: always()
    steps:
      - name: Every check must have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # Anything that is not an outright success — failed, cancelled or
          # skipped because something it needed failed — blocks the merge.
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$failed" ]; then
            echo "::error::These QA jobs did not pass, so this branch cannot be merged: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          count=$(echo "$RESULTS" | jq 'length')
          echo "All $count QA jobs passed."
