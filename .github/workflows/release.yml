# Cuts a release: runs the same QA gate as every pull request, then compiles the
# installers for macOS, Windows and Linux and attaches them to a GitHub release.
# Nothing is published unless the gate passes first.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.9.0)'
        required: true

permissions:
  contents: write

jobs:
  qa:
    name: QA gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Installers (${{ matrix.name }})
    needs: qa
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            command: npm run dist:mac
          - os: windows-latest
            name: Windows
            command: npm run dist:win
          - os: ubuntu-latest
            name: Linux
            command: npm run dist:linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: The tag matches the version in package.json
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
      - name: Compile the installers
        run: ${{ matrix.command }}
        env:
          # Add CSC_LINK / CSC_KEY_PASSWORD (macOS) and WIN_CSC_LINK secrets to
          # sign; without them the build is unsigned but still installable.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the installers and that the packaged app starts
        shell: bash
        run: node scripts/check-artifacts.js --launch
      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
