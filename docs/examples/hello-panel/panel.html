<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:system-ui;color:#ececea;background:#1b1c20;padding:14px}button{font:inherit;background:#4fc8b4;color:#0f1a18;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}.n{font-size:32px;font-weight:600;margin:8px 0}</style></head>
<body><div>Shared counter</div><div class="n" id="n">…</div><button id="b">Count</button>
<script>
function call(tool, args) { return new Promise((res) => { const id = Math.random().toString(36).slice(2); const h = (e) => { if (e.data && e.data.lyra === 'result' && e.data.id === id) { window.removeEventListener('message', h); res(e.data); } }; window.addEventListener('message', h); parent.postMessage({ lyra: 'call', id, tool, args }, '*'); }); }
async function refresh() { const r = await call('hello_read', {}); document.getElementById('n').textContent = r.ok ? JSON.parse(r.result).count : r.error; }
document.getElementById('b').onclick = async () => { await call('hello_count', { who: 'panel' }); refresh(); };
refresh();
</script></body></html>
